<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#e8e5dc"/>
  <rect x="36" y="28" width="1128" height="744" fill="#f5f1e7"/>
  <g fill="#535149" font-family="Georgia, 'Times New Roman', serif">
    <text x="600" y="75" text-anchor="middle" font-size="16" letter-spacing="3">ДЕМОНСТРАЦИОННАЯ СТРАНИЦА</text>
    <path d="M88 96H1112" stroke="#9a9588"/>
    <text x="88" y="145" font-size="32">§ 1. Общие сведения о строении клетки</text>
    <g font-size="18">
      <text x="88" y="189">Клетка представляет собой структурную и функциональную единицу живого организма.</text>
      <text x="88" y="219">Её организация включает поверхностный аппарат, цитоплазму и расположенное в ней ядро.</text>
      <text x="88" y="249">При рассмотрении микроскопической структуры необходимо учитывать взаимосвязь частей.</text>
      <text x="88" y="298">Плазматическая мембрана ограничивает клетку,</text>
      <text x="88" y="325">отделяя внутреннюю среду от окружающего</text>
      <text x="88" y="352">пространства. В цитоплазме располагаются</text>
      <text x="88" y="379">органеллы, различающиеся по строению.</text>
      <text x="88" y="421">Ядро содержит генетический материал.</text>
      <text x="88" y="448">Его оболочка отделяет внутреннее содержимое</text>
      <text x="88" y="475">от цитоплазмы. Совокупность структур</text>
      <text x="88" y="502">рассматривается как единая система.</text>
      <text x="88" y="554">На схеме показано условное взаимное</text>
      <text x="88" y="581">расположение основных частей. Размеры</text>
      <text x="88" y="608">и пропорции представлены обобщённо.</text>
      <text x="88" y="665">При изучении материала следует сопоставлять описание со схемой, устанавливая</text>
      <text x="88" y="693">соответствие между названиями элементов, их расположением и основными функциями.</text>
    </g>
    <g fill="none" stroke="#747167" stroke-width="2">
      <ellipse cx="842" cy="440" rx="190" ry="143"/>
      <ellipse cx="842" cy="440" rx="181" ry="135"/>
      <ellipse cx="831" cy="438" rx="70" ry="59"/>
      <circle cx="845" cy="435" r="18"/>
      <path d="M720 380q35-38 51 2t-47 24 18-36M908 504q38-33 58-3t-38 23 3-33M905 368l39 6-17 20-22-26M710 471q48-12 52 27t-48 7"/>
      <path d="M980 337l75-42M835 424l135-21h90M744 520l-50 70h-40"/>
    </g>
    <g font-size="15">
      <text x="1060" y="295">1</text><text x="1068" y="409">2</text><text x="641" y="597">3</text>
      <text x="718" y="622">Рис. 1. Обобщённая схема клетки</text>
    </g>
    <path d="M88 724H1112" stroke="#b9b2a3"/>
    <text x="88" y="750" font-size="13">Демо-макет для сравнения. Не является страницей академического издания.</text>
    <text x="1112" y="750" text-anchor="end" font-size="16">18</text>
  </g>
</svg>
