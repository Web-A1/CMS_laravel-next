<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <rect width="800" height="1000" fill="#e8e5dc"/>
  <rect x="24" y="24" width="752" height="952" fill="#f5f1e7"/>
  <g fill="#535149" font-family="Georgia, 'Times New Roman', serif">
    <text x="400" y="78" text-anchor="middle" font-size="17" letter-spacing="2">ДЕМОНСТРАЦИОННАЯ СТРАНИЦА</text>
    <path d="M66 105H734" stroke="#9a9588"/>
    <text x="66" y="160" font-size="32">§ 1. Строение клетки</text>
    <g font-size="21">
      <text x="66" y="205">Клетка представляет собой структурную и функциональную</text>
      <text x="66" y="236">единицу живого организма. Её организация включает</text>
      <text x="66" y="267">поверхностный аппарат, цитоплазму и ядро.</text>
      <text x="66" y="315">Плазматическая мембрана ограничивает клетку, отделяя</text>
      <text x="66" y="346">внутреннюю среду от окружающего пространства.</text>
      <text x="66" y="377">В цитоплазме располагаются органеллы. Ядро содержит</text>
      <text x="66" y="408">генетический материал. Структуры образуют единую систему.</text>
    </g>
    <g fill="none" stroke="#747167" stroke-width="2">
      <ellipse cx="400" cy="593" rx="216" ry="140"/>
      <ellipse cx="400" cy="593" rx="206" ry="131"/>
      <ellipse cx="396" cy="590" rx="77" ry="63"/>
      <circle cx="405" cy="586" r="19"/>
      <path d="M262 538q37-33 52 1t-45 24M495 647q42-36 59-2t-47 25M561 489l81-43M447 575l137-22h57M291 675l-40 71"/>
    </g>
    <text x="650" y="448" font-size="20">1</text><text x="652" y="557" font-size="20">2</text><text x="242" y="771" font-size="20">3</text>
    <text x="235" y="790" font-size="19">Рис. 1. Общая схема клетки</text>
    <g font-size="21">
      <text x="66" y="845">При изучении материала следует сопоставлять описание</text>
      <text x="66" y="876">со схемой и устанавливать соответствие между элементами.</text>
    </g>
    <path d="M66 916H734" stroke="#b9b2a3"/>
    <text x="66" y="947" font-size="16">Демо-макет. Не является страницей издания.</text>
    <text x="734" y="947" text-anchor="end" font-size="18">18</text>
  </g>
</svg>
